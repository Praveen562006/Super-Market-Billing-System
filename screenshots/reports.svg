  <text x="380" y="285" font-family="Arial" font-size="9" fill="#6b7280">240</text>
  <text x="455" y="285" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">&#8377;9,600</text>

  <line x1="235" y1="298" x2="545" y2="298" stroke="#e6e9f0" stroke-width="1"/>
