  <text x="380" y="253" font-family="Arial" font-size="9" fill="#6b7280">Qty</text>
  <text x="460" y="253" font-family="Arial" font-size="9" fill="#6b7280">Revenue</text>

  <line x1="235" y1="263" x2="545" y2="263" stroke="#e6e9f0" stroke-width="1"/>
