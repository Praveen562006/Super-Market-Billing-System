  <text x="380" y="320" font-family="Arial" font-size="9" fill="#6b7280">180</text>
  <text x="455" y="320" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">&#8377;10,080</text>

  <line x1="235" y1="333" x2="545" y2="333" stroke="#e6e9f0" stroke-width="1"/>
  <text x="250" y="355" font-family="Arial" font-size="9" fill="#172033">Bread</text>
  <text x="380" y="355" font-family="Arial" font-size="9" fill="#6b7280">320</text>
  <text x="455" y="355" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">&#8377;11,200</text>

  <line x1="235" y1="368" x2="545" y2="368" stroke="#e6e9f0" stroke-width="1"/>
  <text x="250" y="390" font-family="Arial" font-size="9" fill="#172033">Eggs</text>
  <text x="380" y="390" font-family="Arial" font-size="9" fill="#6b7280">95</text>
  <text x="455" y="390" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">&#8377;6,840</text>

  <line x1="235" y1="403" x2="545" y2="403" stroke="#e6e9f0" stroke-width="1"/>
  <text x="250" y="420" font-family="Arial" font-size="9" fill="#172033">Cheese</text>
  <text x="380" y="420" font-family="Arial" font-size="9" fill="#6b7280">45</text>
  <text x="455" y="420" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">&#8377;11,250</text>

  <!-- Payment summary -->
  <rect x="580" y="195" width="190" height="235" rx="12" fill="url(#card4)"/>
  <text x="600" y="220" font-family="Arial" font-size="12" font-weight="bold" fill="#172033">Payment Summary</text>

  <line x1="600" y1="235" x2="750" y2="235" stroke="#e6e9f0" stroke-width="1"/>
  <text x="600" y="260" font-family="Arial" font-size="9" fill="#6b7280">Cash</text>
  <text x="680" y="260" font-family="Arial" font-size="9" fill="#6b7280">89 bills</text>
  <text x="730" y="260" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">&#8377;14.2K</text>

  <text x="600" y="290" font-family="Arial" font-size="9" fill="#6b7280">Card</text>
  <text x="680" y="290" font-family="Arial" font-size="9" fill="#6b7280">45 bills</text>
  <text x="730" y="290" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">&#8377;7.8K</text>

  <text x="600" y="320" font-family="Arial" font-size="9" fill="#6b7280">Online</text>
  <text x="680" y="320" font-family="Arial" font-size="9" fill="#6b7280">22 bills</text>
  <text x="730" y="320" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">&#8377;2.6K</text>

  <!-- Payment method bars -->
  <rect x="600" y="345" width="150" height="8" rx="4" fill="#e6e9f0"/>
  <rect x="600" y="345" width="105" height="8" rx="4" fill="#ff6b4a"/>
  <text x="600" y="365" font-family="Arial" font-size="8" fill="#6b7280">Cash (57%)</text>

  <rect x="600" y="375" width="150" height="8" rx="4" fill="#e6e9f0"/>
  <rect x="600" y="375" width="50" height="8" rx="4" fill="#2e90fa"/>
  <text x="600" y="395" font-family="Arial" font-size="8" fill="#6b7280">Card (29%)</text>

  <rect x="600" y="405" width="150" height="8" rx="4" fill="#e6e9f0"/>
  <rect x="600" y="405" width="25" height="8" rx="4" fill="#7a5af8"/>
  <text x="600" y="425" font-family="Arial" font-size="8" fill="#6b7280">Online (14%)</text>
