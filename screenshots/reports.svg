  <rect x="640" y="18" width="60" height="28" rx="6" fill="#1e2a3a"/>
  <text x="655" y="36" font-family="Arial" font-size="10" fill="#8b97ad">Print</text>
  <rect x="705" y="18" width="70" height="28" rx="6" fill="#1e2a3a"/>
  <text x="718" y="36" font-family="Arial" font-size="10" fill="#8b97ad">CSVExport</text>

  <!-- Filter bar -->
  <rect x="220" y="60" width="550" height="40" rx="8" fill="url(#card4)"/>
  <rect x="235" y="70" width="80" height="22" rx="4" fill="#f1f3f9"/>
  <text x="245" y="85" font-family="Arial" font-size="9" fill="#6b7280">This month</text>
  <rect x="325" y="70" width="70" height="22" rx="4" fill="#f1f3f9"/>
  <text x="335" y="85" font-family="Arial" font-size="9" fill="#6b7280">Start date</text>
  <rect x="405" y="70" width="70" height="22" rx="4" fill="#f1f3f9"/>
  <text x="415" y="85" font-family="Arial" font-size="9" fill="#6b7280">End date</text>
  <rect x="490" y="70" width="60" height="22" rx="4" fill="#172033"/>
