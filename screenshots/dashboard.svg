<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7e5f"/>
      <stop offset="100%" stop-color="#ff5c7a"/>
    </linearGradient>
    <linearGradient id="chart-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff735c"/>
      <stop offset="100%" stop-color="#2e90fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Sidebar -->
  <rect width="200" height="450" fill="#0d1424"/>
  <rect x="20" y="25" width="40" height="40" rx="10" fill="url(#accent)"/>
  <text x="70" y="50" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">SuperMarket</text>
  <text x="70" y="66" font-family="Arial" font-size="10" fill="#8b97ad">Billing System</text>

  <!-- Sidebar nav items -->
  <rect x="10" y="95" width="180" height="36" rx="8" fill="#ff6b4a" opacity="0.15"/>
  <circle cx="30" cy="113" r="6" fill="#ff6b4a"/>
  <text x="46" y="118" font-family="Arial" font-size="12" fill="#ff6b4a" font-weight="600">Dashboard</text>

  <circle cx="30" cy="150" r="6" fill="#8b97ad"/>
  <text x="46" y="155" font-family="Arial" font-size="12" fill="#8b97ad">Billing / POS</text>

  <circle cx="30" cy="185" r="6" fill="#8b97ad"/>
  <text x="46" y="190" font-family="Arial" font-size="12" fill="#8b97ad">Products</text>

  <circle cx="30" cy="220" r="6" fill="#8b97ad"/>
  <text x="46" y="225" font-family="Arial" font-size="12" fill="#8b97ad">Inventory</text>

  <circle cx="30" cy="255" r="6" fill="#8b97ad"/>
  <text x="46" y="260" font-family="Arial" font-size="12" fill="#8b97ad">Reports</text>

  <circle cx="30" cy="290" r="6" fill="#8b97ad"/>
  <text x="46" y="295" font-family="Arial" font-size="12" fill="#8b97ad">Users</text>

  <!-- Main content area -->
  <rect x="220" y="20" width="560" height="30" rx="6" fill="#ffffff" opacity="0.05"/>
  <text x="235" y="40" font-family="Arial" font-size="13" fill="#8b97ad">Search...</text>

  <!-- Top bar -->
  <circle cx="740" cy="35" r="16" fill="#1e2a3a"/>
  <text x="733" y="40" font-family="Arial" font-size="14" fill="#8b97ad">&#128100;</text>

  <!-- Welcome section -->
  <rect x="220" y="65" width="560" height="80" rx="12" fill="url(#card)"/>
  <text x="240" y="92" font-family="Arial" font-size="11" fill="#ff6b4a" font-weight="600">POINT OF SALE &amp; INVENTORY</text>
  <text x="240" y="115" font-family="Arial" font-size="18" font-weight="bold" fill="#172033">Welcome back, Admin</text>
  <text x="240" y="135" font-family="Arial" font-size="11" fill="#6b7280">5 bill(s) generated today worth &#8377;2,450.00</text>

  <!-- Stat cards -->
  <rect x="220" y="160" width="130" height="75" rx="10" fill="url(#card)"/>
  <circle cx="245" cy="185" r="14" fill="#ecfdf3"/>
  <text x="240" y="190" font-family="Arial" font-size="14" fill="#12b76a">&#128176;</text>
  <text x="240" y="210" font-family="Arial" font-size="9" fill="#6b7280">Today's Revenue</text>
  <text x="240" y="228" font-family="Arial" font-size="14" font-weight="bold" fill="#172033">&#8377;2,450</text>

  <rect x="360" y="160" width="130" height="75" rx="10" fill="url(#card)"/>
  <circle cx="385" cy="185" r="14" fill="#eff8ff"/>
  <text x="380" y="190" font-family="Arial" font-size="14" fill="#2e90fa">&#128179;</text>
  <text x="380" y="210" font-family="Arial" font-size="9" fill="#6b7280">Today's Bills</text>
  <text x="380" y="228" font-family="Arial" font-size="14" font-weight="bold" fill="#172033">5</text>

  <rect x="500" y="160" width="130" height="75" rx="10" fill="url(#card)"/>
  <circle cx="525" cy="185" r="14" fill="#fff1ec"/>
  <text x="520" y="190" font-family="Arial" font-size="14" fill="#ff6b4a">&#128230;</text>
  <text x="520" y="210" font-family="Arial" font-size="9" fill="#6b7280">Active Products</text>
  <text x="520" y="228" font-family="Arial" font-size="14" font-weight="bold" fill="#172033">142</text>

  <rect x="640" y="160" width="130" height="75" rx="10" fill="url(#card)"/>
  <circle cx="665" cy="185" r="14" fill="#fffaeb"/>
  <text x="660" y="190" font-family="Arial" font-size="14" fill="#f79009">&#9888;</text>
  <text x="660" y="210" font-family="Arial" font-size="9" fill="#6b7280">Low Stock</text>
  <text x="660" y="228" font-family="Arial" font-size="14" font-weight="bold" fill="#f79009">8</text>

  <!-- Chart card -->
  <rect x="220" y="250" width="340" height="180" rx="12" fill="url(#card)"/>
  <text x="240" y="275" font-family="Arial" font-size="13" font-weight="bold" fill="#172033">Sales Overview</text>
  <rect x="460" y="262" width="80" height="22" rx="6" fill="#fff1ec"/>
  <text x="470" y="277" font-family="Arial" font-size="9" fill="#ff6b4a">14 days</text>

  <!-- Chart area -->
  <rect x="240" y="290" width="300" height="120" rx="6" fill="#f8f9fc"/>
  <!-- Chart grid lines -->
  <line x1="250" y1="310" x2="530" y2="310" stroke="#e6e9f0" stroke-width="1"/>
  <line x1="250" y1="340" x2="530" y2="340" stroke="#e6e9f0" stroke-width="1"/>
  <line x1="250" y1="370" x2="530" y2="370" stroke="#e6e9f0" stroke-width="1"/>
  <!-- Chart line -->
  <polyline points="260,360 290,340 320,350 350,320 380,330 410,300 440,310 470,290 500,280 520,295"
    fill="none" stroke="#ff735c" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="260,380 290,370 320,375 350,360 380,365 410,350 440,355 470,340 500,345 520,335"
    fill="none" stroke="#2e90fa" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Recent transactions card -->
  <rect x="580" y="250" width="190" height="180" rx="12" fill="url(#card)"/>
  <text x="600" y="275" font-family="Arial" font-size="12" font-weight="bold" fill="#172033">Recent Sales</text>
  <line x1="600" y1="290" x2="750" y2="290" stroke="#e6e9f0" stroke-width="1"/>
  <text x="600" y="310" font-family="Arial" font-size="9" fill="#6b7280">INV-001</text>
  <text x="720" y="310" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">&#8377;520</text>
  <text x="600" y="335" font-family="Arial" font-size="9" fill="#6b7280">INV-002</text>
  <text x="720" y="335" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">&#8377;340</text>
  <text x="600" y="360" font-family="Arial" font-size="9" fill="#6b7280">INV-003</text>
  <text x="720" y="360" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">&#8377;890</text>
  <text x="600" y="385" font-family="Arial" font-size="9" fill="#6b7280">INV-004</text>
  <text x="720" y="385" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">&#8377;210</text>
  <text x="600" y="410" font-family="Arial" font-size="9" fill="#6b7280">INV-005</text>
  <text x="720" y="410" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">&#8377;480</text>
</svg>