  <text x="420" y="340" font-family="Arial" font-size="9" fill="#6b7280">EGG-004</text>
  <text x="530" y="340" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">45</text>
  <rect x="615" y="329" width="45" height="16" rx="4" fill="#ecfdf3"/>
