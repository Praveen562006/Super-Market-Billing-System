  <text x="420" y="270" font-family="Arial" font-size="9" fill="#6b7280">DRY-002</text>
  <text x="530" y="270" font-family="Arial" font-size="9" font-weight="bold" fill="#172033">8</text>
  <rect x="615" y="259" width="50" height="16" rx="4" fill="#fffaeb"/>
