  <!-- Pagination -->
  <text x="250" y="410" font-family="Arial" font-size="9" fill="#6b7280">Showing 1-5 of 142</text>
  <rect x="680" y="398" width="24" height="18" rx="4" fill="#ff6b4a"/>
