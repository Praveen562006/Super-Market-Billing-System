  <rect x="690" y="294" width="55" height="16" rx="4" fill="#fff1ec"/>
  <text x="698" y="306" font-family="Arial" font-size="8" fill="#ff6b4a">Adjust</text>

  <line x1="235" y1="318" x2="755" y2="318" stroke="#e6e9f0" stroke-width="1"/>
