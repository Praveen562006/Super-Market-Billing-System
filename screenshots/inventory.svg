  <text x="240" y="112" font-family="Arial" font-size="18" font-weight="bold" fill="#172033">142</text>

  <rect x="360" y="65" width="130" height="65" rx="10" fill="url(#card3)"/>
  <text x="380" y="88" font-family="Arial" font-size="9" fill="#6b7280">Low Stock</text>
