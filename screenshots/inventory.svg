  <rect x="690" y="329" width="55" height="16" rx="4" fill="#fff1ec"/>
  <text x="698" y="341" font-family="Arial" font-size="8" fill="#ff6b4a">Adjust</text>

  <line x1="235" y1="353" x2="755" y2="353" stroke="#e6e9f0" stroke-width="1"/>
  <text x="250" y="375" font-family="Arial" font-size="9" fill="#172033">Cheese</text>
  <text x="420" y="375" font-family="Arial" font-size="9" fill="#6b7280">CHS-005</text>
